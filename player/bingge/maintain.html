<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匯入照片 — 斌哥播放器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d2b1f;
    --gold: #d4a843;
    --gold-soft: #e8c97a;
    --paper: #f3efe4;
    --line: rgba(255,255,255,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Noto Sans TC", "PingFang TC", sans-serif;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(212,168,67,.18), transparent 40%),
      linear-gradient(165deg, #081912, var(--ink) 50%, #143024);
    color: var(--paper);
    padding: 40px 18px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  a.back {
    color: var(--gold-soft); text-decoration: none; font-size: 13px; letter-spacing: .06em;
    opacity: .85;
  }
  a.back:hover { opacity: 1; }
  h1 {
    font-family: "Noto Serif TC", serif; font-size: clamp(26px, 5vw, 36px);
    margin: 14px 0 8px;
  }
  .lead { opacity: .7; line-height: 1.7; margin-bottom: 28px; font-size: 14px; }
  .card {
    border: 1px solid var(--line);
    background: rgba(0,0,0,.22);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-family: "Noto Serif TC", serif; font-size: 18px; color: var(--gold-soft);
    margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; opacity: .75; margin-bottom: 8px; }
  input[type="text"] {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(255,255,255,.06);
    color: var(--paper); font: inherit; margin-bottom: 12px;
  }
  input[type="text"]:focus { outline: 1px solid var(--gold); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    appearance: none; border: 1px solid rgba(212,168,67,.45);
    background: rgba(212,168,67,.14); color: var(--paper);
    font: inherit; cursor: pointer; border-radius: 999px;
    padding: 10px 18px; letter-spacing: .04em;
  }
  button.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 600; }
  button.danger { border-color: rgba(220,120,90,.5); background: rgba(220,120,90,.15); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .drop {
    margin-top: 8px; border: 1.5px dashed rgba(212,168,67,.4);
    border-radius: 14px; padding: 28px 16px; text-align: center;
    background: rgba(212,168,67,.05); cursor: pointer; transition: .2s;
  }
  .drop.drag { border-color: var(--gold); background: rgba(212,168,67,.12); }
  .drop strong { display: block; margin-bottom: 6px; }
  .drop span { font-size: 13px; opacity: .65; }
  input[type="file"] { display: none; }
  .msg {
    margin-top: 12px; font-size: 13px; min-height: 1.4em; opacity: .85;
  }
  .msg.ok { color: #b7e0c2; }
  .msg.err { color: #f0b0a0; }
  .theme-list { display: flex; flex-direction: column; gap: 10px; }
  .theme-row {
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .theme-row .name { font-family: "Noto Serif TC", serif; font-size: 16px; }
  .theme-row .meta { font-size: 12px; opacity: .65; }
  .theme-row .ops { display: flex; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: 12px; opacity: .5; margin-top: 16px; line-height: 1.7; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← 回播放器首頁</a>
    <h1>匯入照片</h1>
    <p class="lead">先填「主題名稱」（會變成資料夾），再選照片匯入。首頁會出現同名主題供播放。</p>

    <section class="card">
      <h2>1. 主題名稱</h2>
      <label for="themeName">例如：山西漫遊、波羅的海、2026 生日</label>
      <input id="themeName" type="text" maxlength="60" placeholder="輸入主題／資料夾名稱" autocomplete="off">
      <div class="row">
        <button class="primary" type="button" id="btnCreate">建立主題</button>
        <span class="msg" id="createMsg"></span>
      </div>
    </section>

    <section class="card">
      <h2>2. 匯入到此主題</h2>
      <label>照片會進入上方填的資料夾（可多選）</label>
      <div class="drop" id="dropZone" tabindex="0">
        <strong>點擊選擇，或把照片拖進來</strong>
        <span>支援 JPG／PNG／WEBP（可一次多張）</span>
      </div>
      <input id="fileInput" type="file" accept="image/*,.heic" multiple>
      <div class="row" style="margin-top:12px;">
        <button class="primary" type="button" id="btnUpload" disabled>開始匯入</button>
        <span class="msg" id="uploadMsg"></span>
      </div>
    </section>

    <section class="card">
      <h2>已有主題</h2>
      <div class="theme-list" id="themeList"></div>
      <p class="hint">刪除主題會連同該資料夾內照片一併移除（僅本機 Library，不影響旅行書網站）。</p>
    </section>
  </div>

<script>
(function () {
  var nameEl = document.getElementById('themeName');
  var createMsg = document.getElementById('createMsg');
  var uploadMsg = document.getElementById('uploadMsg');
  var fileInput = document.getElementById('fileInput');
  var dropZone = document.getElementById('dropZone');
  var btnUpload = document.getElementById('btnUpload');
  var listEl = document.getElementById('themeList');
  var pendingFiles = [];

  function setMsg(el, text, ok) {
    el.textContent = text || '';
    el.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
  }

  async function refreshThemes() {
    listEl.innerHTML = '<p class="meta">讀取中…</p>';
    try {
      var res = await fetch('/api/themes');
      var data = await res.json();
      var themes = data.themes || [];
      if (!themes.length) {
        listEl.innerHTML = '<p class="meta">尚無主題</p>';
        return;
      }
      listEl.innerHTML = '';
      themes.forEach(function (t) {
        var row = document.createElement('div');
        row.className = 'theme-row';
        row.innerHTML =
          '<div><div class="name"></div><div class="meta"></div></div>' +
          '<div class="ops">' +
          '<button type="button" data-act="use">選用</button>' +
          '<button type="button" data-act="play">播放</button>' +
          '<button type="button" class="danger" data-act="del">刪除</button>' +
          '</div>';
        row.querySelector('.name').textContent = t.name;
        row.querySelector('.meta').textContent = t.count + ' 張 · 資料夾 Library/' + t.name;
        row.querySelector('[data-act="use"]').addEventListener('click', function () {
          nameEl.value = t.name;
          setMsg(createMsg, '已選用「' + t.name + '」', true);
        });
        row.querySelector('[data-act="play"]').addEventListener('click', function () {
          location.href = '/#play=' + encodeURIComponent(t.name);
        });
        row.querySelector('[data-act="del"]').addEventListener('click', async function () {
          if (!confirm('確定刪除主題「' + t.name + '」與其中照片？')) return;
          var r = await fetch('/api/themes/' + encodeURIComponent(t.name), { method: 'DELETE' });
          var j = await r.json();
          if (!r.ok) { alert(j.error || '刪除失敗'); return; }
          refreshThemes();
        });
        listEl.appendChild(row);
      });
    } catch (err) {
      listEl.innerHTML = '<p class="msg err">無法連線伺服器，請先執行「開始播放.command」</p>';
    }
  }

  document.getElementById('btnCreate').addEventListener('click', async function () {
    var name = (nameEl.value || '').trim();
    if (!name) { setMsg(createMsg, '請先輸入主題名稱', false); return; }
    try {
      var res = await fetch('/api/themes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      var data = await res.json();
      if (!res.ok) { setMsg(createMsg, data.error || '建立失敗', false); return; }
      setMsg(createMsg, data.created ? ('已建立「' + name + '」') : ('主題「' + name + '」已存在，可直接匯入'), true);
      refreshThemes();
    } catch (err) {
      setMsg(createMsg, '連線失敗', false);
    }
  });

  function takeFiles(fileList) {
    pendingFiles = Array.from(fileList || []).filter(function (f) {
      return /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic)$/i.test(f.name);
    });
    btnUpload.disabled = !pendingFiles.length;
    setMsg(uploadMsg, pendingFiles.length ? ('已選 ' + pendingFiles.length + ' 張，按「開始匯入」') : '', true);
  }

  dropZone.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { takeFiles(fileInput.files); });
  ;['dragenter', 'dragover'].forEach(function (ev) {
    dropZone.addEventListener(ev, function (e) {
      e.preventDefault(); dropZone.classList.add('drag');
    });
  });
  ;['dragleave', 'drop'].forEach(function (ev) {
    dropZone.addEventListener(ev, function (e) {
      e.preventDefault(); dropZone.classList.remove('drag');
    });
  });
  dropZone.addEventListener('drop', function (e) {
    takeFiles(e.dataTransfer.files);
  });

  btnUpload.addEventListener('click', async function () {
    var name = (nameEl.value || '').trim();
    if (!name) { setMsg(uploadMsg, '請先填主題名稱', false); return; }
    if (!pendingFiles.length) { setMsg(uploadMsg, '尚未選擇照片', false); return; }
    btnUpload.disabled = true;
    setMsg(uploadMsg, '匯入中…', true);
    try {
      // ensure theme exists
      await fetch('/api/themes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      var fd = new FormData();
      pendingFiles.forEach(function (f) { fd.append('files', f, f.name); });
      var res = await fetch('/api/themes/' + encodeURIComponent(name) + '/photos', {
        method: 'POST',
        body: fd
      });
      var data = await res.json();
      if (!res.ok) { setMsg(uploadMsg, data.error || '匯入失敗', false); btnUpload.disabled = false; return; }
      setMsg(uploadMsg, '完成：新增 ' + data.saved + ' 張' + (data.skipped ? ('，略過 ' + data.skipped) : '') + ' · 主題共 ' + data.count + ' 張', true);
      pendingFiles = [];
      fileInput.value = '';
      refreshThemes();
    } catch (err) {
      setMsg(uploadMsg, '匯入失敗：' + err, false);
      btnUpload.disabled = false;
    }
  });

  refreshThemes();
})();
</script>
</body>
</html>
