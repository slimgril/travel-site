<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斌哥照片播放器 — 使用說明</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0d2b1f; --gold:#d4a843; --paper:#f3efe4; }
  body {
    margin:0; min-height:100vh; font-family:"Noto Sans TC",sans-serif; color:var(--paper);
    background: linear-gradient(160deg,#081912,var(--ink) 50%,#163528);
    padding:48px 20px 80px;
  }
  .wrap { max-width:640px; margin:0 auto; }
  a { color:var(--gold); }
  h1 { font-family:"Noto Serif TC",serif; font-size:clamp(28px,5vw,40px); line-height:1.3; margin:12px 0 16px; }
  ol { line-height:1.9; padding-left:1.2em; opacity:.9; }
  .box {
    margin-top:28px; padding:18px 16px; border:1px solid rgba(212,168,67,.35);
    border-radius:14px; background:rgba(0,0,0,.22); line-height:1.75; font-size:14px;
  }
  code { color:#e8c97a; }
</style>
</head>
<body>
  <div class="wrap">
    <p style="opacity:.7;letter-spacing:.2em;font-size:12px;">BINGGE PHOTO PLAYER</p>
    <h1>照片播放器<br>主題＝資料夾，自行維護</h1>
    <ol>
      <li><strong>Windows</strong>：雙擊 <code>START.bat</code>（需已安裝 Python 3；黑窗須出現 <code>LAUNCHER_V5</code>）</li>
      <li><strong>Mac</strong>：雙擊 <code>開始播放.command</code></li>
      <li>瀏覽器開啟後，點「匯入照片」</li>
      <li>輸入<strong>主題名稱</strong>（會建立同名資料夾）</li>
      <li>選照片匯入 → 回首頁點主題播放</li>
    </ol>
    <div class="box">
      本包<strong>不含照片</strong>。照片存在本機 <code>Library/主題名稱/</code>。<br>
      可建多個主題（山西、波羅的海…），首頁會全部列出。<br>
      也可直接把照片資料夾放進 <code>Library/</code>，重整即可播放。
    </div>
  </div>
</body>
</html>
