<div id="lightbox">
  <span class="lightbox-close">&times;</span>
  <img src="" alt="">

<script>
(function () {
  var btn = document.getElementById('back-top');
  if (!btn) return;
  var detail = document.querySelector('.day-section, .map-section, .days-nav');
  function sync() {
    var show = !!detail && window.scrollY > 240;
    btn.classList.toggle('is-visible', show);
  }
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  window.addEventListener('scroll', sync, { passive: true });
  sync();
})();
</script>
<script>
(function () {
  var lb = document.getElementById('lightbox');
  var lbImg = lb.querySelector('img');
  var lbCaption = lb.querySelector('.lightbox-caption');

  function extractUrl(el) {
    if (el.tagName === 'IMG') return el.src;
    var bg = el.style.backgroundImage || getComputedStyle(el).backgroundImage;
    var m = bg && bg.match(/url\((['"]?)(.*?)\1\)/);
    return m ? m[2] : null;
  }

  function caption(el) {
    var label = el.querySelector && el.querySelector('.img-label');
    if (label) return label.textContent;
    return el.getAttribute('alt') || '';
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('.site-img.photo, .live-img');
    if (!el || el.classList.contains('video-card') || e.target.closest('.video-card')) return;
    var src = extractUrl(el);
    if (!src) return;
    lbImg.src = src;
    lbCaption.textContent = caption(el);
    lb.classList.add('open');
  });

  lb.addEventListener('click', function () {
    lb.classList.remove('open');
    lbImg.src = '';
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      lb.classList.remove('open');
      lbImg.src = '';
    }
  });
})();
</script>

<script>
/* Lithuanian vinyl — Day 2 cultural widget */
(function () {
  var FADE_OUT_MS = 2800;

  function prefersReducedMotion() {
    return window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function wire(btn) {
    if (btn._ltWired) return;
    btn._ltWired = true;
    var wrap = btn.closest('.lt-vinyl-wrap') || btn.parentElement;
    var audio = wrap && wrap.querySelector('audio.lt-vinyl__audio');
    var src = (audio && audio.getAttribute('src')) || btn.getAttribute('data-src');
    if (!audio) {
      if (!src) return;
      audio = new Audio(src);
    }
    audio.preload = 'auto';
    audio.volume = 1;
    try { audio.setAttribute('playsinline', ''); } catch (e) {}
    var hint = btn.querySelector('.lt-vinyl__hint');
    var fadeTimer = null;
    var fadingOut = false;

    function clearFade() {
      if (fadeTimer) {
        clearInterval(fadeTimer);
        fadeTimer = null;
      }
    }

    function setVol(v) {
      try { audio.volume = Math.max(0, Math.min(1, v)); } catch (e) {}
    }

    function idleLabel() {
      if (hint) hint.textContent = '點擊播放 · 15s';
      btn.setAttribute('aria-pressed', 'false');
      btn.classList.remove('is-playing');
    }
    function playingLabel() {
      if (hint) hint.textContent = '播放中 · 再點暫停';
      btn.setAttribute('aria-pressed', 'true');
      btn.classList.add('is-playing');
    }
    function failLabel(msg) {
      if (hint) hint.textContent = msg || '無法播放音訊';
      btn.setAttribute('aria-pressed', 'false');
      btn.classList.remove('is-playing');
    }
    function reset() {
      clearFade();
      fadingOut = false;
      audio.pause();
      try { audio.currentTime = 0; } catch (e) {}
      setVol(1);
      idleLabel();
    }

    function fadeOutThenReset() {
      if (fadingOut) return;
      fadingOut = true;
      clearFade();
      if (prefersReducedMotion()) {
        reset();
        return;
      }
      var from = audio.volume > 0.05 ? audio.volume : 1;
      var steps = Math.max(12, Math.round(FADE_OUT_MS / 40));
      var i = 0;
      fadeTimer = setInterval(function () {
        i += 1;
        var t = i / steps;
        var eased = 1 - Math.pow(1 - t, 2.2);
        setVol(from * (1 - eased));
        if (i >= steps) {
          clearFade();
          reset();
        }
      }, FADE_OUT_MS / steps);
    }

    btn.addEventListener('click', function (e) {
      e.preventDefault();
      if (audio.error) {
        failLabel('音檔損壞或路徑錯誤');
        return;
      }
      if (fadingOut) return;
      if (audio.paused) {
        // Ensure we start from beginning if previous play ended
        if (audio.ended || audio.currentTime > 14.5) {
          try { audio.currentTime = 0; } catch (err) {}
        }
        setVol(1);
        fadingOut = false;
        var p = audio.play();
        if (p && p.then) {
          p.then(playingLabel).catch(function (err) {
            failLabel('瀏覽器阻擋播放' + (err && err.name ? '（' + err.name + '）' : ''));
          });
        } else {
          playingLabel();
        }
      } else {
        fadeOutThenReset();
      }
    });
    audio.addEventListener('timeupdate', function () {
      if (audio.paused || fadingOut) return;
      var dur = audio.duration;
      if (!isFinite(dur) || dur <= 0) return;
      var remain = dur - audio.currentTime;
      if (remain <= FADE_OUT_MS / 1000) {
        fadeOutThenReset();
      }
    });
    audio.addEventListener('ended', function () {
      if (!fadingOut) reset();
    });
    audio.addEventListener('error', function () {
      failLabel('音檔載入失敗');
    });
    audio.addEventListener('pause', function () {
      if (fadingOut) return;
      if (!audio.ended && audio.currentTime > 0 && audio.paused) {
        btn.classList.remove('is-playing');
        btn.setAttribute('aria-pressed', 'false');
        if (hint && hint.textContent.indexOf('無法') !== 0 && hint.textContent.indexOf('音檔') !== 0) {
          hint.textContent = '已暫停 · 點擊繼續';
        }
      }
    });
  }

  function boot() {
    document.querySelectorAll('.lt-vinyl').forEach(wire);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
<script>
/* Click-to-play video cards
   配樂先行／畫面晚出；片尾畫面先收／配樂晚收；音量與畫面淡入淡出加長 */
(function () {
  var AUDIO_FADE_MS = 4500;   /* 片尾音量淡出（提早開始＋加長，聽得出來） */
  var VISUAL_LEAD_MS = 2500;  /* 點擊後先聽配樂，再淡入畫面 */
  var VISUAL_TRAIL_MS = 5200; /* 畫面略早於配樂開始收 */
  var SHORT_DUR_S = 12;       /* 短片縮短先行／延遲，避免吃掉全片 */
  var MIN_FADE_MS = 2800;     /* 縮時後仍保留可感知的最短淡出 */

  function prefersReducedMotion() {
    return window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function clearFade(card) {
    if (card._fadeTimer) {
      clearInterval(card._fadeTimer);
      card._fadeTimer = null;
    }
  }

  function clearLead(card) {
    if (card._leadTimer) {
      clearTimeout(card._leadTimer);
      card._leadTimer = null;
    }
  }

  function setVol(video, v) {
    try { video.volume = Math.max(0, Math.min(1, v)); } catch (e) {}
  }

  function timingFor(duration) {
    var durMs = (isFinite(duration) && duration > 0) ? duration * 1000 : 20000;
    var lead = VISUAL_LEAD_MS;
    var trail = VISUAL_TRAIL_MS;
    var fade = AUDIO_FADE_MS;
    if (duration > 0 && duration < SHORT_DUR_S) {
      lead = 800;
      trail = Math.min(2200, Math.round(durMs * 0.35));
      fade = Math.min(2800, Math.round(durMs * 0.4));
    }
    /* 先行＋延遲＋淡出不得超過片長的一半；淡出優先保底 */
    var budget = Math.max(0, durMs * 0.5);
    var need = lead + trail + fade;
    if (need > budget && budget > 0) {
      var scale = budget / need;
      lead = Math.round(lead * scale);
      trail = Math.round(trail * scale);
      fade = Math.max(MIN_FADE_MS, Math.round(fade * scale));
      /* 極短片：淡出最多吃到片長 45% */
      if (duration > 0) {
        fade = Math.min(fade, Math.round(durMs * 0.45));
      }
    }
    /* 畫面先收：trail 至少略長於 fade，讓人先看見淡出再聽完音量 */
    if (trail < fade + 400) {
      trail = fade + 400;
    }
    return { lead: lead, trail: trail, fade: fade };
  }

  /** Ramp volume from→to over ms; respects reduced-motion (instant). */
  function fadeVolume(video, card, from, to, ms, done) {
    clearFade(card);
    if (prefersReducedMotion() || !ms || ms <= 0) {
      setVol(video, to);
      if (done) done();
      return;
    }
    var steps = Math.max(12, Math.round(ms / 40));
    var stepMs = ms / steps;
    var i = 0;
    setVol(video, from);
    card._fadeTimer = setInterval(function () {
      i += 1;
      /* ease-out：後半段降得更明顯，聽得出「慢慢消失」 */
      var t = i / steps;
      var eased = 1 - Math.pow(1 - t, 2.2);
      setVol(video, from + (to - from) * eased);
      if (i >= steps) {
        clearFade(card);
        setVol(video, to);
        if (done) done();
      }
    }, stepMs);
  }

  function hardReset(card) {
    var video = card.querySelector('video.video-card__media');
    clearFade(card);
    clearLead(card);
    card.classList.remove('is-playing', 'is-flashing', 'is-picture-on', 'is-picture-out');
    card._flashing = false;
    card._fadingOut = false;
    card._endTrailArmed = false;
    card._endAudioArmed = false;
    card._timing = null;
    if (card._flashTimer) {
      clearTimeout(card._flashTimer);
      card._flashTimer = null;
    }
    if (!video) return;
    video.pause();
    try { video.currentTime = 0; } catch (e) {}
    setVol(video, 0);
  }

  function resetCard(card, withFade) {
    var video = card.querySelector('video.video-card__media');
    if (!video || !withFade || card._fadingOut) {
      hardReset(card);
      return;
    }
    card._fadingOut = true;
    clearLead(card);
    /* 手動停止：畫面慢慢消失，音量淡出 */
    card.classList.remove('is-picture-on');
    card.classList.add('is-picture-out');
    var fade = (card._timing && card._timing.fade) || AUDIO_FADE_MS;
    fadeVolume(video, card, video.volume || 0, 0, fade, function () {
      hardReset(card);
    });
  }

  function revealPicture(card) {
    if (!card.classList.contains('is-playing') || card._fadingOut) return;
    card.classList.remove('is-picture-out');
    card.classList.add('is-picture-on');
  }

  function startPlayback(card) {
    var video = card.querySelector('video.video-card__media');
    if (!video) return;
    card.classList.remove('is-flashing', 'is-picture-on', 'is-picture-out');
    card.classList.add('is-playing');
    card._fadingOut = false;
    card._endTrailArmed = true;
    card._endAudioArmed = true;

    function begin(t) {
      card._timing = t;
      try { video.muted = false; } catch (e) {}
      setVol(video, 0);
      var p = video.play();
      if (p && p.catch) {
        p.catch(function () {
          hardReset(card);
        });
      }
      /* 配樂先淡入；畫面仍蓋住照片，晚幾秒再淡入影片 */
      fadeVolume(video, card, 0, 1, t.fade);
      if (prefersReducedMotion() || t.lead <= 0) {
        revealPicture(card);
      } else {
        clearLead(card);
        card._leadTimer = setTimeout(function () {
          card._leadTimer = null;
          revealPicture(card);
        }, t.lead);
      }
    }

    var dur = video.duration;
    if (isFinite(dur) && dur > 0) {
      begin(timingFor(dur));
    } else {
      video.addEventListener('loadedmetadata', function onceMeta() {
        video.removeEventListener('loadedmetadata', onceMeta);
        begin(timingFor(video.duration));
      });
      begin(timingFor(0));
    }
  }

  function playCard(card) {
    var video = card.querySelector('video.video-card__media');
    if (!video || card._flashing || card._fadingOut) return;
    if (prefersReducedMotion()) {
      startPlayback(card);
      return;
    }
    card._flashing = true;
    card.classList.add('is-flashing');
    card._flashTimer = setTimeout(function () {
      card._flashTimer = null;
      card._flashing = false;
      startPlayback(card);
    }, 150);
  }

  function wire(card) {
    if (card._videoWired) return;
    card._videoWired = true;
    var video = card.querySelector('video.video-card__media');
    if (!video) return;

    function activate(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (card._fadingOut) return;
      if (card.classList.contains('is-playing') || card._flashing) {
        resetCard(card, true);
        return;
      }
      playCard(card);
    }

    card.addEventListener('click', activate);
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        activate(e);
      }
    });
    video.addEventListener('timeupdate', function () {
      if (!card.classList.contains('is-playing') || card._fadingOut) return;
      var dur = video.duration;
      if (!isFinite(dur) || dur <= 0) return;
      var t = card._timing || timingFor(dur);
      card._timing = t;
      var remain = dur - video.currentTime;
      var trailS = t.trail / 1000;
      var fadeS = t.fade / 1000;

      /* 畫面提早慢慢收：約 trail 秒前開始淡出，一路收到接近結束 */
      if (card._endTrailArmed && remain <= trailS) {
        card._endTrailArmed = false;
        card.classList.remove('is-picture-on');
        card.classList.add('is-picture-out');
      }
      /* 配樂晚收但加長：在片尾前開始淡出，務必在影片結束前把音量收到接近 0 */
      if (card._endAudioArmed && remain <= fadeS) {
        card._endAudioArmed = false;
        card._fadingOut = true;
        var from = video.volume > 0.05 ? video.volume : 1;
        /* 以剩餘時間為上限，避免影片 ended 時音量還很高而驟停 */
        var ms = Math.min(t.fade, Math.max(remain * 1000, 0));
        if (ms < MIN_FADE_MS && remain * 1000 >= MIN_FADE_MS * 0.6) {
          ms = Math.min(MIN_FADE_MS, remain * 1000);
        }
        ms = Math.max(700, ms);
        fadeVolume(video, card, from, 0, ms, function () {
          hardReset(card);
        });
      }
    });
    video.addEventListener('ended', function () {
      /* 若淡出尚未跑完，補一段短淡出再收；否則直接重置 */
      if (card._fadingOut) return;
      var vol = 0;
      try { vol = video.volume; } catch (e) {}
      if (vol > 0.05 && !prefersReducedMotion()) {
        card._fadingOut = true;
        fadeVolume(video, card, vol, 0, Math.min(1200, AUDIO_FADE_MS), function () {
          hardReset(card);
        });
        return;
      }
      hardReset(card);
    });
  }

  function boot() {
    document.querySelectorAll('.video-card').forEach(wire);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
